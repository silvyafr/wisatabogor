<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Wisata Bogor</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Wisata Bogor</h1>
        <p>Kelola Data Destinasi Wisata Bogor</p>
    </header>

    <section class="form-container">

        <h2>Tambah Wisata</h2>

        <form id="wisataForm">

            <input
                type="text"
                id="nama"
                placeholder="Nama Wisata"
                required
            >

            <select id="kategori">

                <option value="Wisata Alam">
                    Wisata Alam
                </option>

                <option value="Curug">
                    Curug
                </option>

                <option value="Camping">
                    Camping
                </option>

                <option value="Wisata Keluarga">
                    Wisata Keluarga
                </option>

            </select>

            <input
                type="text"
                id="lokasi"
                placeholder="Lokasi"
                required
            >

            <input
                type="number"
                id="harga"
                placeholder="Harga Tiket"
                required
            >

            <input
                type="text"
                id="gambar"
                placeholder="URL Gambar"
                required
            >

            <textarea
                id="deskripsi"
                placeholder="Deskripsi Wisata"
                required
            ></textarea>

            <button type="submit">
                Simpan
            </button>

        </form>

    </section>

    <section class="list-container">

        <h2>Daftar Wisata</h2>

        <div id="wisataList">

        </div>

    </section>

<script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>
